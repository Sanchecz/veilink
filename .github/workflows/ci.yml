name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Validate configuration fixtures
        shell: bash
        run: |
          chmod 0600 testdata/client.valid.yaml
          chmod 0640 testdata/server.valid.yaml
          go run ./cmd/veilink validate --type client --config testdata/client.valid.yaml
          go run ./cmd/veilink validate --type server --config testdata/server.valid.yaml

  security-and-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - run: go test -race -count=1 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  linux-production-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: go build -buildvcs=false -trimpath -o ./veilink ./cmd/veilink
      - run: sudo env PATH="$PATH" go test -tags=integration -count=1 ./internal/device
      - run: sudo nft -c -f deploy/nftables/veilink.nft
      - name: Verify systemd unit
        run: |
          sudo useradd --system --home /nonexistent --shell /usr/sbin/nologin veilink
          sudo install -m 0755 ./veilink /usr/local/bin/veilink
          sudo systemd-analyze verify deploy/systemd/veilink.service
      - run: bash -n scripts/*.sh deploy/install-server.sh
      - run: sudo ./scripts/smoke-server-linux.sh ./veilink

  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - run: ./scripts/build-release.sh v0.1.0-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veilink-release-candidate
          path: dist/
          if-no-files-found: error
